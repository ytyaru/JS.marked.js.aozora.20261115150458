## Unicode境界値・非漢字混合ルビテスト（パイプ省略形）

* 踊り字（々・〻）：佐々木《ささき》、人々《ひとびと》、各〻《かくかく》
* 漢数字ゼロ（〇）：一〇〇《ひゃく》、二〇二六《にせんにじゅうろく》
* 準漢字・小書き（〆・ヶ・ヵ・ヿ）：〆切《しめきり》、一ヶ月《いっかげつ》、三ヵ所《さんかしょ》、合略ヿ《こと》
* 異体字セレクタ（IVS）：葛󠄀城市《かつらぎし》（「葛」の直後にU+E0100が結合した字）
* サロゲートペア拡張漢字（CJK拡張B以降）：𠮟咤《しった》、𠮷野家《よしのや》
* カタカナ・ひらがな混じり（パイプ必須）：｜やる気《モチベーション》、｜Webサイト《ホームページ》

# エスケープ確認

## 単一

### 全角

* ＼*
* ＼｜（全角縦棒の無効化）
* ＼《（開き二重山括弧の無効化）
* ＼》（閉じ二重山括弧の無効化）
* ＼｀（全角バッククォートの無効化）
* ＼＼（全角バックスラッシュ自体の出力）
* ＼\（半角縦棒の無効化）

### 半角

* \*
* \|（半角バックスラッシュでの全角縦棒無効化）
* \\（半角バックスラッシュ自体の出力）
* \｜（全角縦棒の無効化）
* \《（開き二重山括弧の無効化）
* \》（閉じ二重山括弧の無効化）
* \｀（全角バッククォートの無効化）
* \＼（全角バックスラッシュ自体の出力）

## 範囲

全角バッククォートで囲んだ範囲をそのままの文字として出力する。そこにメタ文字があってもOK。

* ｀｜漢字《かんじ》｀
* ｀《《全角》》｀
* 漢字｀《スキル名》｀

## 併用

* ＼｜漢字｀《スキル名》｀
