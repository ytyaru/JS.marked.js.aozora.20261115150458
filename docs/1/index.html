<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Offline Markdown Preview</title>
  <!-- ローカルに保存したファイルを相対パスで読み込む -->
  <script src="./lib/marked/15.0.2/marked.min.js"></script>

  <script>
// ルビ記法（｜親文字《ルビ》）の拡張定義例
const rubyExtension = {
  name: 'ruby',
  level: 'inline', // インライン要素として安全に処理
  start(src) { return src.indexOf('｜'); },
  tokenizer(src) {
    const rule = /^｜([^《\n]+)《([^》\n]+)》/;
    const match = rule.exec(src);
    if (match) {
      return {
        type: 'ruby',
        raw: match[0],
        text: match[1],
        ruby: match[2]
      };
    }
  },
  renderer(token) {
    return `<ruby>${token.text}<rt>${token.ruby}</rt></ruby>`;
  }
};

// パーサーに組み込む（傍点や割り注も同じ形式で並べて登録可能）
marked.use({ extensions: [rubyExtension] });
</script>
</head>
<body>
  <div id="content"></div>

  <script>
    const markdownText = `
# オフライン動作テスト
- **太字**のテスト
- リスト表示のテスト

1. リスト1
2. リスト2

版|コメント
--|--------
1|やあ
2|さあ

｜漢字《かんじ》。
    `;
    // marked.parse() でHTMLに変換して描画
    document.getElementById('content').innerHTML = marked.parse(markdownText);
  </script>
</body>
</html>
